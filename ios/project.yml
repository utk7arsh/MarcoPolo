# XcodeGen spec: `brew install xcodegen && cd ios && xcodegen` writes Marco.xcodeproj (not checked in).
# Signed with Utkarsh's free Personal Team. Someone else building it: change DEVELOPMENT_TEAM and the bundle id.
name: Marco
options:
  bundleIdPrefix: com.utkarshlal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
targets:
  Marco:
    type: application
    platform: iOS
    sources:
      - path: Marco
        excludes: [Info.plist]
    info:                            # merged with the INFOPLIST_KEY_* settings below; for keys Xcode can't generate
      path: Marco/Info.plist
      properties:
        UIAppFonts:
          - InstrumentSans-Regular.ttf
          - InstrumentSans-Medium.ttf
          - InstrumentSans-SemiBold.ttf
        CFBundleDisplayName: Marco Polo
        NSLocalNetworkUsageDescription: Marco connects to your server to send camera and depth observations.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true   # Finder > iPhone > Files > Marco shows Documents/sessions (recordings)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarshlal.marco
        DEVELOPMENT_TEAM: 7764XWK2G5
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Marco uses the camera and LiDAR to see where your things are."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Marco listens for \"Marco\" and your questions."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Marco turns what you say into questions, on this iPhone."
        INFOPLIST_KEY_NSMotionUsageDescription: "Marco uses your AirPods' head tracking so sounds stay where things are."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
