# XcodeGen spec: `brew install xcodegen && cd ios && xcodegen` writes Marco.xcodeproj (not checked in).
# Change the bundle id to something unique to you, then pick your (free) Personal Team under Signing.
name: Marco
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
targets:
  Marco:
    type: application
    platform: iOS
    sources:
      - path: Marco
        excludes: [Info.plist]
    info:
      path: Marco/Info.plist
      properties:
        UIAppFonts:
          - InstrumentSans-Regular.ttf
          - InstrumentSans-Medium.ttf
          - InstrumentSans-SemiBold.ttf
        CFBundleDisplayName: Marco Polo
        NSLocalNetworkUsageDescription: Marco connects to your server to send camera and depth observations.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.marco
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Marco uses the camera and LiDAR to see where your things are."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Marco listens for \"Marco\" and your questions."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Marco turns what you say into questions, on this iPhone."
        INFOPLIST_KEY_NSMotionUsageDescription: "Marco uses your AirPods' head tracking so sounds stay where things are."
